name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: python -m pip install ziglang==0.17.1 lupa==2.8 pyguitarpro==0.11
      - name: Tests
        run: python tests/test_gplink.py
      - name: Build extension
        run: python extension/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: reaper_gplink-x64
          path: extension/dist/reaper_gplink-x64.dll
